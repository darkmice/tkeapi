# TokensByte Docker Compose 配置
# ──────────────────────────────────────────────────
# 一键启动: docker compose up -d
#
# 优先级: .env 文件 > compose 内默认值
# 镜像策略: pull_policy=never 使用本地镜像，不自动构建
# 如需重新构建: docker compose build 或改 pull_policy: missing
# ──────────────────────────────────────────────────
#
# ── 切换为外部数据库 ──────────────────────────────
# 1. 修改 .env 中的 DATABASE_URL 指向外部数据库
#    例: DATABASE_URL=postgres://user:pass@db.example.com:5432/tokensbyte
# 2. 注释掉下方 postgres 服务
# 3. 删除 backend 的 depends_on: postgres
# ──────────────────────────────────────────────────

services:
  postgres:
    image: ${DOCKER_IMAGE_PREFIX:-}postgres:18.4-alpine
    container_name: ${PROJECT_NAME:-tokensbyte}-postgres
    command: postgres -c shared_buffers=512MB -c work_mem=32MB -c maintenance_work_mem=128MB -c effective_cache_size=1536MB -c synchronous_commit=off -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c random_page_cost=1.1
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-tokensapi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tokensapi}
      - POSTGRES_DB=${POSTGRES_DB:-tokensapi}
    volumes:
      - postgres-data:/var/lib/postgresql
    # 可选：暴露端口到宿主机，方便本地工具连接（如 pgAdmin, DBeaver 等）
    # 如需暴露，取消下面两行注释
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - app-network
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tokensapi}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 蓝绿热更新：backend 为 blue 槽位（默认运行），backend-green 为 green 槽位（profile=green，由 hot-update.sh 编排）
  backend: &backend-svc
    image: ${BACKEND_IMAGE_BLUE:-${PROJECT_NAME:-tokensbyte}-backend:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DOCKER_IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX:-}
        # 0=容器内编译（默认，跨平台安全）；1=使用根目录 tokensbyte-server-bin（需 Linux ELF 且架构匹配）
        USE_PREBUILT: ${USE_PREBUILT:-0}
        # 脚本会注入：Mac 默认 1、Windows 默认 2；交叉架构强制 1；可自行覆盖
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
        # 1=启用 Cargo BuildKit cache；交叉架构(QEMU)时导出脚本会置 0 防 segfault
        ENABLE_CARGO_CACHE: ${ENABLE_CARGO_CACHE:-1}
    pull_policy: missing
    container_name: ${PROJECT_NAME:-tokensbyte}-backend
    stop_grace_period: 120s
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgres://tokensapi:tokensapi@postgres:5432/tokensapi}
      - JWT_SECRET=${JWT_SECRET:-} # 可选：手动指定，留空则自动生成强随机密钥并持久化
      # - CORS_ORIGINS=${CORS_ORIGINS}                    # 生产环境必须设置允许的前端域名（逗号分隔），如: https://example.com
      # - APP_ENV=production
      - REGISTER_ENABLED=${REGISTER_ENABLED:-true}
      - RUST_LOG=${RUST_LOG:-info}
      - DATA_DIR=/app/data
      - TZ=Asia/Shanghai
      - LOG_DIR=/app/logs
      - HTTP_CONNECT_TIMEOUT_SECS=${HTTP_CONNECT_TIMEOUT_SECS:-3}
      - HTTP_POOL_MAX_IDLE_PER_HOST=${HTTP_POOL_MAX_IDLE_PER_HOST:-300}
      - HTTP_POOL_IDLE_TIMEOUT_SECS=${HTTP_POOL_IDLE_TIMEOUT_SECS:-60}
      - MAX_IN_FLIGHT_REQUESTS=${MAX_IN_FLIGHT_REQUESTS:-2000} # 全局在途请求反压上限（防雪崩保护，小规格主机建议 500-1000，高配主机可调至 5000+）
      - WORKERS_STANDBY=${WORKERS_STANDBY:-1} # 单例后台任务 leader 选举：蓝绿并存期仅一个进程运行扫库/定时任务；设为 0 恢复"启动即运行"
      - SHUTDOWN_DRAIN_SECS=${SHUTDOWN_DRAIN_SECS:-30} # HTTP 优雅关闭排空窗口（秒）；放宽时需同步 ≥ 该值的 stop_grace_period
    command: /app/tokensbyte-server
    volumes:
      - ./data:/app/data
      - ./logs/backend:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "6"
    # 不暴露端口到宿主机，仅通过前端 nginx 反向代理访问
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped # 蓝绿槽位被脚本停止后，宿主机/Docker 重启不应把闲置槽位拉起
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # 显式声明文件句柄上限，与生产部署项目 (tokensbyte-deploy-ws) 对齐；根治高并发下 Too many open files (os error 24)
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEM_LIMIT:-3072M}
          cpus: '${BACKEND_CPU_LIMIT:-2.0}'
        reservations:
          memory: ${BACKEND_MEM_RES:-256M}
          cpus: '${BACKEND_CPU_RES:-0.5}'

  # green 槽位：复用 backend 全部配置，仅覆盖镜像 / 容器名 / 日志目录；profile 限定后 `docker compose up -d` 不会启动它
  backend-green:
    <<: *backend-svc
    profiles: [ "green" ]
    image: ${BACKEND_IMAGE_GREEN:-${PROJECT_NAME:-tokensbyte}-backend:latest}
    container_name: ${PROJECT_NAME:-tokensbyte}-backend-green
    volumes:
      - ./data:/app/data
      - ./logs/backend-green:/app/logs

  frontend:
    image: ${PROJECT_NAME:-tokensbyte}-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        DOCKER_IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX:-}
    pull_policy: missing
    container_name: ${PROJECT_NAME:-tokensbyte}-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      - CLIENT_MAX_BODY_SIZE=${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - ./logs/frontend:/var/log/nginx
      # 热更新：静态资源版本目录（current 符号链接原子切换）与后端上游声明（nginx -s reload 切换）；空目录启动时由容器入口自动播种
      - ./web:/srv/web
      - ./nginx-upstream:/etc/nginx/upstream
    networks:
      - app-network
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/index.html || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # 显式声明文件句柄上限，与生产部署项目 (tokensbyte-deploy-ws) 对齐；镜像内 worker_rlimit_nofile 65535 依赖此硬限制
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEM_LIMIT:-256M}
          cpus: '${FRONTEND_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${FRONTEND_MEM_RES:-128M}
          cpus: '${FRONTEND_CPU_RES:-0.25}'

networks:
  app-network:
    driver: bridge
    name: ${PROJECT_NAME:-tokensbyte}-network

volumes:
  postgres-data:
    name: tokensbyte_postgres-data
